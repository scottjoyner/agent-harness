name: model-quality

on:
  push:
    paths:
      - 'model_quality_bench.py'
      - 'test_model_quality_bench.py'
      - 'benchmarks/model_selection/**'
      - '.github/workflows/model-quality.yml'
  pull_request:
    paths:
      - 'model_quality_bench.py'
      - 'test_model_quality_bench.py'
      - 'benchmarks/model_selection/**'
      - '.github/workflows/model-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile runner
        run: python -m py_compile model_quality_bench.py test_model_quality_bench.py
      - name: Validate frozen manifest
        run: python model_quality_bench.py --validate-only
      - name: Run unit tests
        run: python -m unittest -v test_model_quality_bench.py
